<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <title>선부365 식사 · 근무표 통합</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans KR",sans-serif;background:#f4f7f4;color:#17201a}
    #boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    #boot .box{background:#fff;border:1px solid #dfe7e1;border-radius:18px;padding:24px;max-width:360px;width:100%;box-shadow:0 12px 34px rgba(20,83,45,.09)}
    #boot b{display:block;font-size:18px;color:#14532d;margin-bottom:8px}#boot span{font-size:12px;color:#6b756e;line-height:1.6}
  </style>
</head>
<body>
  <div id="boot"><div class="box"><b>선부365 식사 · 근무표</b><span>데이터를 불러오는 중입니다.</span></div></div>
  <div id="root"></div>
  <div id="toastRoot"></div>
  <script>
  (async()=>{
    const decode=(b64)=>{
      const clean=b64.replace(/\s+/g,'');
      const bin=atob(clean);
      const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    };
    const read=async names=>{
      const parts=await Promise.all(names.map(async n=>{
        const r=await fetch(n+'?v=8',{cache:'no-store'});
        if(!r.ok) throw new Error(n+' '+r.status);
        return (await r.text()).trim();
      }));
      return decode(parts.join(''));
    };
    try{
      const [css,js]=await Promise.all([
        read(['css01.b64','css02.b64']),
        read(['app01.b64','app02.b64','app03.b64','app04.b64','app05.b64','app06.b64'])
      ]);
      const style=document.createElement('style');style.textContent=css;document.head.appendChild(style);
      document.getElementById('boot').remove();
      const script=document.createElement('script');script.textContent=js;document.body.appendChild(script);
    }catch(e){
      document.querySelector('#boot .box').innerHTML='<b>불러오기에 실패했습니다.</b><span>잠시 후 새로고침해주세요.<br>'+String(e.message||e)+'</span>';
    }
  })();
  </script>
</body>
</html>
